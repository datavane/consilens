# 由 bin/generate-benchmark-data.sh 生成的数据的 PostgreSQL e2e 比对配置。

source:
  type: postgresql
  name: generated-source
  connection:
    url: ${env.BENCHMARK_JDBC_URL}
    username: ${env.BENCHMARK_DB_USER}
    password: ${env.BENCHMARK_DB_PASSWORD}
  resource:
    type: table
    name: ${env.BENCHMARK_SOURCE_TABLE:benchmark_source}

target:
  type: postgresql
  name: generated-target
  connection:
    url: ${env.BENCHMARK_JDBC_URL}
    username: ${env.BENCHMARK_DB_USER}
    password: ${env.BENCHMARK_DB_PASSWORD}
  resource:
    type: table
    name: ${env.BENCHMARK_TARGET_TABLE:benchmark_target}

comparison:
  keys:
    source: [id]
    target: [id]
  fields:
    source: [payload, amount]
    target: [payload, amount]

strategy:
  mode: checksum
  algorithm: xor
  bisectionFactor: 8
  bisectionThreshold: 8000
  batchSize: 5000
  maxDifferences: 100000000

concurrency:
  io:
    core: 8
    max: 32
    queueSize: 10000
    keepAliveSeconds: 60
    threadNamePrefix: benchmark-io-
  cpu:
    core: 4
    max: 8
    queueSize: 5000
    keepAliveSeconds: 60
    threadNamePrefix: benchmark-cpu-

result:
  sinks:
    - format: console
      type: result
