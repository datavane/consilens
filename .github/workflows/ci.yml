name: CI

on:
  push:
    branches:
      - dev
      - main
    paths:
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
      - 'mcp-skills/**'
      - 'consilens-cli/**'
      - 'consilens-common/**'
      - 'consilens-connector/**'
      - 'consilens-cluster/**'
      - 'consilens-core/**'
      - 'consilens-sdk/**'
      - 'consilens-benchmark/**'
      - 'consilens-mcp/**'
      - 'consilens-server/**'
      - 'consilens-sink/**'
      - 'consilens-spi/**'
      - 'consilens-ui/**'
      - 'consilens-dist/**'
      - 'examples/**'
      - 'scripts/**'
      - '.mvn/**'
      - 'mvnw'
      - 'pom.xml'
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paths-filter:
    name: CI-Path-Filter
    runs-on: ubuntu-latest
    outputs:
      not-ignore: ${{ steps.filter.outputs.not-ignore }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@b2feaf19c27470162a626bd6fa8438ae5b263721
        id: filter
        with:
          filters: |
            not-ignore:
              - '!(docs/**)'

  build:
    name: CI-Build
    needs: paths-filter
    if: ${{ (needs.paths-filter.outputs.not-ignore == 'true') || (github.event_name == 'push') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '11' ]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
      - name: Check POM versions
        run: python3 scripts/release/check-pom-versions.py
      - name: Check documentation links
        run: python3 scripts/check-doc-links.py
      - name: Package with regression tests on JDK ${{ matrix.java }}
        run: ./mvnw -B package

  mcp:
    name: CI-MCP
    needs: paths-filter
    if: ${{ (needs.paths-filter.outputs.not-ignore == 'true') || (github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Package MCP on JDK 17
        run: ./mvnw -B -Pconsilens-mcp -pl consilens-mcp package
      - name: Smoke MCP jar
        run: |
          jar="$(ls -t consilens-mcp/target/consilens-mcp-*.jar | grep -v -- '-original\.jar$' | head -1)"
          test -n "$jar"
          java -jar "$jar" --version

  docker-verify:
    name: CI-Docker-Verify
    needs: paths-filter
    if: ${{ (needs.paths-filter.outputs.not-ignore == 'true') || (github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: Verify Testcontainers integration suite
        run: scripts/release/release-check.sh --docker-verify-only
      - name: Preserve Failsafe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-testcontainers-reports
          path: |
            consilens-core/target/failsafe-reports/
            .release-checks/
          include-hidden-files: true
          if-no-files-found: error

  oceanbase-verify:
    name: CI-OceanBase-Verify
    needs: paths-filter
    if: ${{ (needs.paths-filter.outputs.not-ignore == 'true') || (github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: Show Docker resources
        run: docker info
      - name: Verify official OceanBase Testcontainer
        run: scripts/release/release-check.sh --oceanbase-verify-only
      - name: Preserve OceanBase Failsafe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-oceanbase-reports
          path: |
            consilens-core/target/failsafe-reports/
            .release-checks/
          include-hidden-files: true
          if-no-files-found: error

  jdk17-smoke:
    name: CI-JDK17-Smoke
    needs: paths-filter
    if: ${{ (needs.paths-filter.outputs.not-ignore == 'true') || (github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Full compile on JDK 17
        run: ./mvnw -B -DskipTests package
      - name: CLI/DuckDB smoke on JDK 17
        run: >
          ./mvnw -B -pl :consilens-cli -am
          -Dtest='DuckDbCompareRuntimeTest,VerifyCommandDuckDbTest,MetricDiffServiceTest'
          -Dsurefire.failIfNoSpecifiedTests=false test

  result:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ build, mcp, docker-verify, oceanbase-verify, jdk17-smoke, paths-filter ]
    if: always()
    steps:
      - name: Status
        run: |
          if [[ '${{ needs.paths-filter.outputs.not-ignore }}' == 'false' && '${{ github.event_name }}' == 'pull_request' ]]; then
            echo "Skip Build!"
            exit 0
          fi
          if [[ '${{ needs.build.result }}' != 'success' ]]; then
            echo "Build Failed!"
            exit 1
          fi
          if [[ '${{ needs.mcp.result }}' != 'success' ]]; then
            echo "MCP Build Failed!"
            exit 1
          fi
          if [[ '${{ needs.docker-verify.result }}' != 'success' ]]; then
            echo "Docker Verify Failed!"
            exit 1
          fi
          if [[ '${{ needs.oceanbase-verify.result }}' != 'success' ]]; then
            echo "OceanBase Verify Failed!"
            exit 1
          fi
          if [[ '${{ needs.jdk17-smoke.result }}' != 'success' ]]; then
            echo "JDK 17 Smoke Failed!"
            exit 1
          fi
