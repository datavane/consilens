source:
  type: oracle
  connection:
    url: jdbc:oracle:thin:@127.0.0.1:1521:ORCL
    username: ${env.ORACLE_USER}
    password: ${env.ORACLE_PASSWORD}
  resource:
    type: table
    name: ORDERS
  readOptions:
    consistency: snapshot
    batchSize: 500
    fetchSize: 1000
target:
  type: oracle
  connection:
    url: jdbc:oracle:thin:@127.0.0.1:1521:ORCL
    username: ${env.ORACLE_USER}
    password: ${env.ORACLE_PASSWORD}
  resource:
    type: table
    name: ORDERS_BACKUP
  readOptions:
    consistency: snapshot
    batchSize: 500
    fetchSize: 1000
comparison:
  keys:
    source: [ORDER_ID]
    target: [ORDER_ID]
  fields:
    source: [CUSTOMER_ID, AMOUNT, STATUS, CREATED_AT]
    target: [CUSTOMER_ID, AMOUNT, STATUS, CREATED_AT]
strategy:
  mode: join
  localCompare:
    mode: row-hash
  maxDifferences: 10000
normalization:
  global:
    decimal:
      precision: 4
      rounding: true
    float:
      precision: 6
      rounding: true
    date:
      format: yyyy-MM-dd
    time:
      format: HH:mm:ss
    datetime:
      format: yyyy-MM-dd HH:mm:ss
      timezone: Asia/Shanghai
    timestamp:
      format: yyyy-MM-dd HH:mm:ss
      timezone: Asia/Shanghai
    binary:
      encoding: hex
    boolean:
      trueValue: "1"
      falseValue: "0"
    varchar:
      nullValue: "NULL"
result:
  sinks:
    - format: console
      type: result
    - format: csv
      type: diff-record
      properties: |
        {
          "path": "./output/oracle-orders-diff.csv"
        }
