# Doris 分区表比对配置 - MySQL vs Doris
# 目标：comparison.filters 指定分区键区间，避免全表扫描。
# 基线：total=4（分区 dt=2026-05-01 内包含全部差异行）。

source:
  type: mysql
  name: source-mysql
  connection:
    url: jdbc:mysql://127.0.0.1:13306/consilens_demo?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${env.MYSQL_USER}
    password: ${env.MYSQL_PASSWORD}
  resource:
    type: table
    name: consilens_performance_demo_table

target:
  type: doris
  name: target-doris
  connection:
    url: jdbc:mysql://127.0.0.1:9030/consilens_demo?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${env.DORIS_USER}
    password: ${env.DORIS_PASSWORD}
  resource:
    type: table
    name: consilens_performance_demo_table

comparison:
  keys:
    source: [record_id]
    target: [record_id]
  fields:
    source: [col_int, col_decimal, amount, status, updated_at]
    target: [col_int, col_decimal, amount, status, updated_at]
  filters:
    source: "dt >= '2026-05-01' AND dt < '2026-05-02'"
    target: "dt >= '2026-05-01' AND dt < '2026-05-02'"

strategy:
  mode: checksum
  algorithm: xor
  bisectionFactor: 8
  bisectionThreshold: 8000
  batchSize: 1000

result:
  sinks:
    - format: console
      type: result
