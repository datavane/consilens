# MySQL vs Doris 明细表 vs 聚合结果比对配置
# 目标：用 source 自定义 SQL 将明细表聚合后，与 target 同逻辑聚合结果做 checksum 比对。
# 两侧使用相同的聚合 SQL，Doris 侧按分区字段 dt 过滤以命中分区。

source:
  type: mysql
  name: source-mysql-detail-aggregate
  connection:
    url: jdbc:mysql://127.0.0.1:13306/consilens_demo?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${env.MYSQL_USER}
    password: ${env.MYSQL_PASSWORD}
  resource:
    type: sql
    path: |
      SELECT DATE(created_at) AS biz_date,
        status,
        COUNT(*) AS order_count,
        SUM(amount) AS total_amount,
        MAX(updated_at) AS updated_at
      FROM consilens_performance_demo_table
      WHERE deleted = 0
      GROUP BY DATE(created_at), status

target:
  type: doris
  name: target-doris-aggregate
  connection:
    url: jdbc:mysql://127.0.0.1:9030/consilens_demo?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${env.DORIS_USER}
    password: ${env.DORIS_PASSWORD}
  resource:
    type: sql
    path: |
      SELECT DATE(created_at) AS biz_date,
        status,
        COUNT(*) AS order_count,
        SUM(amount) AS total_amount,
        MAX(updated_at) AS updated_at
      FROM consilens_performance_demo_table
      WHERE deleted = 0
      GROUP BY DATE(created_at), status

comparison:
  keys:
    source:
      - biz_date
      - status
    target:
      - biz_date
      - status

  fields:
    source:
      - order_count
      - total_amount
      - updated_at
    target:
      - order_count
      - total_amount
      - updated_at

  filters:
    source: "biz_date >= '2026-05-01' AND biz_date < '2026-05-02'"
    target: "biz_date >= '2026-05-01' AND biz_date < '2026-05-02'"

strategy:
  mode: checksum
  algorithm: xor
  bisectionFactor: 4
  bisectionThreshold: 5000
  batchSize: 1000

result:
  sinks:
    - format: console
      type: result
    - format: console
      type: diff-record
