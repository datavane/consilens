source:
  type: doris
  connection:
    url: jdbc:mysql://127.0.0.1:9030/mydb?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${env.DORIS_USER}
    password: ${env.DORIS_PASSWORD}
  resource:
    type: table
    name: orders
  readOptions:
    consistency: snapshot
    batchSize: 500
    fetchSize: 1000
target:
  type: doris
  connection:
    url: jdbc:mysql://127.0.0.1:9030/mydb?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${env.DORIS_USER}
    password: ${env.DORIS_PASSWORD}
  resource:
    type: table
    name: orders_backup
  readOptions:
    consistency: snapshot
    batchSize: 500
    fetchSize: 1000
comparison:
  keys:
    source: [order_id]
    target: [order_id]
  fields:
    source: [customer_id, amount, status, created_at]
    target: [customer_id, amount, status, created_at]
strategy:
  mode: join
  localCompare:
    mode: row-hash
  maxDifferences: 10000
normalization:
  global:
    decimal:
      precision: 4
      rounding: true
    float:
      precision: 6
      rounding: true
    date:
      format: yyyy-MM-dd
    time:
      format: HH:mm:ss
    datetime:
      format: yyyy-MM-dd HH:mm:ss
      timezone: Asia/Shanghai
    timestamp:
      format: yyyy-MM-dd HH:mm:ss
      timezone: Asia/Shanghai
result:
  sinks:
    - format: console
      type: result
    - format: csv
      type: diff-record
      properties: |
        {
          "path": "./output/doris-orders-diff.csv"
        }
    - format: console
      type: result
      enabled: false
