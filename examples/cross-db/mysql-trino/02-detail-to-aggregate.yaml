# MySQL vs Trino 明细表 vs 聚合表比对配置
# 目标：用 source 自定义 SQL 将明细表聚合后，与 target 聚合结果表做 checksum 比对。

source:
  type: mysql
  name: source-mysql-detail-aggregate
  connection:
    url: jdbc:mysql://127.0.0.1:13306/consilens_demo?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${env.MYSQL_USER}
    password: ${env.MYSQL_PASSWORD}
  resource:
    type: sql
    path: |
      SELECT DATE(created_at) AS biz_date,
        status,
        COUNT(*) AS order_count,
        SUM(amount) AS total_amount,
        MAX(updated_at) AS updated_at
      FROM consilens_performance_demo_table
      WHERE deleted = 0
      GROUP BY DATE(created_at), status

target:
  type: trino
  name: target-trino-aggregate
  connection:
    url: jdbc:trino://127.0.0.1:8081/mysql/consilens_demo_target
    username: ${env.TRINO_USER}
    password: ${env.TRINO_PASSWORD}
  resource:
    type: table
    name: daily_order_summary

comparison:
  keys:
    source:
      - biz_date
      - status
    target:
      - biz_date
      - status

  fields:
    source:
      - order_count
      - total_amount
      - updated_at
    target:
      - order_count
      - total_amount
      - updated_at

strategy:
  mode: checksum
  algorithm: xor
  bisectionFactor: 2
  bisectionThreshold: 100000
  batchSize: 1000

result:
  sinks:
    - format: console
      type: result
