source:
  type: mysql
  connection:
    url: jdbc:mysql://127.0.0.1:13306/consilens_demo?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${env.MYSQL_USER}
    password: ${env.MYSQL_PASSWORD}
  resource:
    type: sql
    path: |
      SELECT record_id, col_tinyint, col_int, col_decimal, amount, status, updated_at
      FROM consilens_performance_demo_table
target:
  type: starrocks
  connection:
    url: jdbc:mysql://127.0.0.1:9030/consilens_demo?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${env.STARROCKS_USER}
    password: ${env.STARROCKS_PASSWORD}
  resource:
    type: sql
    path: |
      SELECT record_id, col_tinyint, col_int, col_decimal, amount, status, updated_at
      FROM consilens_performance_demo_table
comparison:
  keys:
    source: [record_id]
    target: [record_id]

  fields:
    source:
      - col_tinyint
      - col_int
      - col_decimal
      - amount
      - status
      - updated_at
    target:
      - col_tinyint
      - col_int
      - col_decimal
      - amount
      - status
      - updated_at

strategy:
  mode: checksum
  algorithm: xor
  bisectionFactor: 8
  bisectionThreshold: 8000
  batchSize: 2000
concurrency:
  io:
    core: 8
    max: 32
    queueSize: 10000
    keepAliveSeconds: 60
    threadNamePrefix: consilens-io-
  cpu:
    core: 4
    max: 8
    queueSize: 5000
    keepAliveSeconds: 60
    threadNamePrefix: consilens-cpu-
result:
  sinks:
    - format: console
      type: result
    - format: table
      type: diff-record
      properties: |
        {
          "type": "mysql",
          "url": "jdbc:mysql://127.0.0.1:13306/diff_results?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true",
          "username": "${env.MYSQL_USER}",
          "password": "${env.MYSQL_PASSWORD}",
          "driver": "com.mysql.cj.jdbc.Driver",
          "maxPoolSize": 10,
          "prefix": "diff_results_",
          "suffixTimestamp": true,
          "createTable": true,
          "dropIfExists": false,
          "defaultColumnLength": 500,
          "batchSize": 100
        }
