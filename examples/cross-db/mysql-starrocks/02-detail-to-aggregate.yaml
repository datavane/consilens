source:
  type: mysql
  name: source-mysql-detail-aggregate
  connection:
    url: jdbc:mysql://127.0.0.1:13306/consilens_demo?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${env.MYSQL_USER}
    password: ${env.MYSQL_PASSWORD}
  resource:
    type: sql
    path: |
      SELECT DATE(created_at) AS biz_date,
        status,
        COUNT(*) AS order_count,
        SUM(amount) AS total_amount,
        MAX(updated_at) AS updated_at
      FROM consilens_performance_demo_table
      WHERE deleted = 0
      GROUP BY DATE(created_at), status

target:
  type: starrocks
  name: target-starrocks-aggregate
  connection:
    url: jdbc:mysql://127.0.0.1:9030/consilens_demo?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${env.STARROCKS_USER}
    password: ${env.STARROCKS_PASSWORD}
  resource:
    type: sql
    path: |
      SELECT DATE(created_at) AS biz_date,
        status,
        COUNT(*) AS order_count,
        SUM(amount) AS total_amount,
        MAX(updated_at) AS updated_at
      FROM consilens_performance_demo_table
      WHERE deleted = 0
      GROUP BY DATE(created_at), status

comparison:
  keys:
    source:
      - biz_date
      - status
    target:
      - biz_date
      - status

  fields:
    source:
      - order_count
      - total_amount
      - updated_at
    target:
      - order_count
      - total_amount
      - updated_at

strategy:
  mode: checksum
  algorithm: xor
  bisectionFactor: 4
  bisectionThreshold: 5000
  batchSize: 1000

result:
  sinks:
    - format: console
      type: result
