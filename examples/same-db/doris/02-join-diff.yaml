source:
  type: doris
  name: source-doris
  connection:
    url: jdbc:mysql://127.0.0.1:9030/mydb?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${env.DORIS_USER}
    password: ${env.DORIS_PASSWORD}
  resource:
    type: table
    name: orders

target:
  type: doris
  name: target-doris
  connection:
    url: jdbc:mysql://127.0.0.1:9030/mydb?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${env.DORIS_USER}
    password: ${env.DORIS_PASSWORD}
  resource:
    type: table
    name: orders_backup

comparison:
  keys:
    source: [order_id]
    target: [order_id]
  fields:
    source: [customer_id, amount, status, created_at]
    target: [customer_id, amount, status, created_at]

strategy:
  mode: join
  algorithm: concat
  bisectionFactor: 4
  bisectionThreshold: 5000
  batchSize: 500
  localCompare:
    mode: row-hash

result:
  sinks:
    - format: console
      type: result
