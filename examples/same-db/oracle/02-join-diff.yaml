# Oracle 同库 join 差异比对配置
# 目标：orders vs orders_backup，覆盖 TARGET_MISSING + MISMATCH。基线：total=2。

source:
  type: oracle
  name: source-Oracle
  connection:
    url: jdbc:oracle:thin:@127.0.0.1:1521:ORCL
    username: ${env.ORACLE_USER}
    password: ${env.ORACLE_PASSWORD}
  resource:
    type: table
    name: ORDERS

target:
  type: oracle
  name: target-Oracle
  connection:
    url: jdbc:oracle:thin:@127.0.0.1:1521:ORCL
    username: ${env.ORACLE_USER}
    password: ${env.ORACLE_PASSWORD}
  resource:
    type: table
    name: ORDERS_BACKUP

comparison:
  keys:
    source: [order_id]
    target: [order_id]
  fields:
    source: [customer_id, amount, status, created_at]
    target: [customer_id, amount, status, created_at]

strategy:
  mode: join
  algorithm: concat
  bisectionFactor: 4
  bisectionThreshold: 5000
  batchSize: 500
  localCompare:
    mode: row-hash

result:
  sinks:
    - format: console
      type: result
