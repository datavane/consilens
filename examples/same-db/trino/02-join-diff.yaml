# TRINO 同库 join 差异比对配置
# 目标：orders vs orders_backup，覆盖 TARGET_MISSING + MISMATCH。基线：total=2。

source:
  type: trino
  name: source-TRINO
  connection:
    url: jdbc:trino://127.0.0.1:8081/mysql/mydb_target
    username: ${env.TRINO_USER}
    password: ${env.TRINO_PASSWORD}
  resource:
    type: table
    name: orders

target:
  type: trino
  name: target-TRINO
  connection:
    url: jdbc:trino://127.0.0.1:8081/mysql/mydb_target
    username: ${env.TRINO_USER}
    password: ${env.TRINO_PASSWORD}
  resource:
    type: table
    name: orders_backup

comparison:
  keys:
    source: [order_id]
    target: [order_id]
  fields:
    source: [customer_id, amount, status, created_at]
    target: [customer_id, amount, status, created_at]

strategy:
  mode: join
  algorithm: concat
  bisectionFactor: 4
  bisectionThreshold: 5000
  batchSize: 500
  localCompare:
    mode: row-hash

result:
  sinks:
    - format: console
      type: result
